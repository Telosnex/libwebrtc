name: libwebrtc binary build/release.
on:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitignore'
      - '.dockerignore'
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      commitHash:
        description: 'webrtc-sdk commit hash'
        default: ''
      configuration:
        description: 'build configuration'
        default: 'release'
        required: true
        type: choice
        options:
          - release
          - debug
      build_linux:
        description: 'Build Linux (x64 + arm64)'
        type: boolean
        default: true
      build_windows:
        description: 'Build Windows (x64 + arm64)'
        type: boolean
        default: true
      build_apple:
        description: 'Build Apple xcframework (mac/ios/tvos/visionos)'
        type: boolean
        default: false
      build_android:
        description: 'Build Android AAR (multi-arch)'
        type: boolean
        default: false

permissions:
  packages: write
  contents: write
  actions: read

jobs:
  build-linux:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_linux == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        profile:
          - ${{ github.event.inputs.configuration || 'release' }}
    name: Build libwebrtc.so for Linux (${{ matrix.arch }}-${{ matrix.profile }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true

      - name: install setuptools
        run: |
          pip3 install setuptools # pkg_resources is sometimes not found?

      - name: Install linux dependencies
        run: |
            sudo apt update -y
            sudo apt install -y ninja-build pkg-config openjdk-11-jdk

      - name: Print ninja version
        run: ninja --version

      - name: Target OS
        run: echo -e "\ntarget_os = [\"linux\"]" >> .gclient
        shell: bash
        working-directory: build

      - name: Free Disk Space (Ubuntu)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/ghc /usr/local/.ghcup
          sudo docker system prune --all --force || true
          sudo apt-get clean
          df -h

      - name: Build WebRTC
        run: chmod +x ./libwebrtc_linux_build.sh && ./libwebrtc_linux_build.sh --arch ${{ matrix.arch }} --profile ${{ matrix.profile }} --commit "${{ github.event.inputs.commitHash }}"
        working-directory: build

      - name: Zip artifact (Unix)
        run: |
          cd build
          zip ${{ github.workspace }}/libwebrtc-linux-${{ matrix.arch }}-${{ matrix.profile }}.zip linux-${{ matrix.arch }}-${{ matrix.profile }} -r

      - name: Generate shasum
        run: |
          cd ${{ github.workspace }}
          shasum -a 256 libwebrtc-linux-${{ matrix.arch }}-${{ matrix.profile }}.zip > libwebrtc-linux-${{ matrix.arch }}-${{ matrix.profile }}.zip.shasum

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: libwebrtc-linux-${{ matrix.arch }}-${{ matrix.profile }}
          path: libwebrtc-linux-${{ matrix.arch }}-${{ matrix.profile }}.zip*

      - name: Package same-build native test tools
        run: |
          tar -C build -czf libwebrtc-linux-${{ matrix.arch }}-${{ matrix.profile }}-tests.tar.gz linux-${{ matrix.arch }}-${{ matrix.profile }}-tests
          sha256sum libwebrtc-linux-${{ matrix.arch }}-${{ matrix.profile }}-tests.tar.gz > libwebrtc-linux-${{ matrix.arch }}-${{ matrix.profile }}-tests.tar.gz.shasum

      - name: Upload native test tools
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: libwebrtc-linux-${{ matrix.arch }}-${{ matrix.profile }}-tests
          path: libwebrtc-linux-${{ matrix.arch }}-${{ matrix.profile }}-tests.tar.gz*

  build-win:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_windows == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        profile:
          - ${{ github.event.inputs.configuration || 'release' }}
    name: Build libwebrtc.dll for Windows (${{ matrix.arch }}-${{ matrix.profile }})
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true

      - name: Install windows dependencies
        run: |
          Invoke-WebRequest -Uri "https://github.com/ninja-build/ninja/releases/latest/download/ninja-win.zip" -OutFile ninja.zip
          Expand-Archive -Path ninja.zip -DestinationPath ${{ github.workspace }}\ninja
          echo "${{ github.workspace }}\ninja" | Out-File -Append -Encoding utf8 -FilePath $Env:GITHUB_PATH

      - name: Print ninja version
        run: ninja --version

      - name: Target OS
        run: echo -e "\ntarget_os = [\"win\"]" >> .gclient
        shell: bash
        working-directory: build

      - name: Build WebRTC
        run: .\libwebrtc_win_build.cmd --arch ${{ matrix.arch }} --profile ${{ matrix.profile }} --commit "${{ github.event.inputs.commitHash }}"
        working-directory: build

      - name: Zip artifact (Windows)
        run: Compress-Archive -Path .\build\libwebrtc-${{ matrix.arch }}-${{ matrix.profile }} -DestinationPath .\build\libwebrtc-win-${{ matrix.arch }}-${{ matrix.profile }}.zip

      - name: Generate shasum
        shell: pwsh
        run: |
          $zip = "build\libwebrtc-win-${{ matrix.arch }}-${{ matrix.profile }}.zip"
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          $name = Split-Path $zip -Leaf
          "$hash  $name" | Out-File -Encoding ascii -NoNewline "$zip.shasum"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: libwebrtc-win-${{ matrix.arch }}-${{ matrix.profile }}
          path: build\libwebrtc-win-${{ matrix.arch }}-${{ matrix.profile }}.zip*

      - name: Package same-build Windows tests
        shell: pwsh
        run: |
          $dir = "build\win-${{ matrix.arch }}-${{ matrix.profile }}-tests"
          $lines = Get-ChildItem $dir -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower())  $($_.Name)"
          }
          $lines | Set-Content -Encoding ascii "$dir\SHA256SUMS"
          $zip = "build\libwebrtc-win-${{ matrix.arch }}-${{ matrix.profile }}-tests.zip"
          Compress-Archive -Path $dir -DestinationPath $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content -Encoding ascii "$zip.shasum"

      - name: Upload Windows test tools
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: libwebrtc-win-${{ matrix.arch }}-${{ matrix.profile }}-tests
          path: build\libwebrtc-win-${{ matrix.arch }}-${{ matrix.profile }}-tests.zip*

  build-apple-slices:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_apple == 'true'
    strategy:
      fail-fast: false
      matrix:
        group: [macos, ios-device, ios-simulator, catalyst, tvos, visionos]
    name: Apple slices (${{ matrix.group }})
    runs-on: macos-26
    timeout-minutes: 240
    env:
      PROFILE: ${{ github.event.inputs.configuration || 'release' }}
      CORE_REVISION: ${{ github.event.inputs.commitHash }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_BASEDIR: ${{ github.workspace }}/build
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - name: Select Xcode 26.0
        run: sudo xcode-select --switch /Applications/Xcode_26.0.app/Contents/Developer
      - name: Validate build groups and assembly before native compilation
        if: matrix.group == 'macos'
        run: python3 -m unittest discover -s tools/tests -p 'test_apple*.py'
      - name: Install compiler cache and show runner resources
        run: |
          brew install ccache
          ccache --version
          sysctl hw.logicalcpu hw.memsize
          xcodebuild -version
      - name: Compute stable cache prefix before Target OS edits .gclient
        id: cache-key
        run: |
          core_key=$(printf '%s' "$CORE_REVISION" | shasum -a 256 | cut -d ' ' -f 1)
          echo "prefix=apple-cc-v1-${{ runner.os }}-${{ runner.arch }}-xcode26-${{ matrix.group }}-${{ env.PROFILE }}-${{ hashFiles('build/.gclient') }}-$core_key" >> "$GITHUB_OUTPUT"
      - name: Restore compiler cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: ${{ steps.cache-key.outputs.prefix }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.cache-key.outputs.prefix }}-
      - name: Target OS
        run: printf '\ntarget_os = ["mac", "ios"]\n' >> .gclient
        working-directory: build
      - name: Build slices (native ownership tests included in macos)
        run: ./libwebrtc_apple_build.sh --profile "$PROFILE" --group "${{ matrix.group }}" --commit "$CORE_REVISION"
        working-directory: build
      - name: Cache statistics
        if: always()
        run: ccache --show-stats
      - name: Save compiler cache
        if: always() && !cancelled()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: ${{ steps.cache-key.outputs.prefix }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Archive verified group (preserve framework symlinks)
        run: |
          python3 - <<'PYCODE'
          import json, os, subprocess
          from pathlib import Path
          out = Path('build') / ('out-' + os.environ['PROFILE'])
          group = '${{ matrix.group }}'
          manifest = json.loads((out / (group + '.json')).read_text())
          subprocess.run(['tar', '-C', str(out), '-cf', 'apple-' + group + '.tar',
            group + '.json', group + '.LICENSE',
            *[s + '/WebRTC.framework' for s in manifest['slices']]], check=True)
          PYCODE
      - name: Upload slice group
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apple-slices-${{ matrix.group }}-${{ env.PROFILE }}
          path: apple-${{ matrix.group }}.tar
          retention-days: 7

  build-apple:
    needs: build-apple-slices
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_apple == 'true'
    name: Assemble verified Apple xcframework
    runs-on: macos-26
    timeout-minutes: 30
    env:
      PROFILE: ${{ github.event.inputs.configuration || 'release' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Select Xcode 26.0
        run: sudo xcode-select --switch /Applications/Xcode_26.0.app/Contents/Developer
      - name: Download slice groups from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: apple-slices-*-${{ env.PROFILE }}
          path: apple-slices
          merge-multiple: true
      - name: Assemble (no checkout of WebRTC or recompilation)
        run: |
          mkdir -p "build/out-$PROFILE"
          for group in macos ios-device ios-simulator catalyst tvos visionos; do
            tar -xf "apple-slices/apple-$group.tar" -C "build/out-$PROFILE"
          done
          cd build
          ./libwebrtc_apple_build.sh --profile "$PROFILE" --package-only
          cd "out-$PROFILE"
          shasum -a 256 WebRTC.xcframework.zip > WebRTC.xcframework.zip.shasum
      - name: Upload complete artifact (same published shape/name)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: webrtc-xcframework-${{ env.PROFILE }}
          path: build/out-${{ env.PROFILE }}/WebRTC.xcframework.zip*

  build-android:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_android == 'true'
    strategy:
      fail-fast: false
      matrix:
        profile:
          - ${{ github.event.inputs.configuration || 'release' }}
    name: Build libwebrtc.aar for Android (${{ matrix.profile }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true

      - name: install setuptools
        run: pip3 install setuptools

      - name: Install linux dependencies
        run: |
          sudo apt update -y
          sudo apt install -y ninja-build pkg-config openjdk-17-jdk

      - name: Print ninja version
        run: ninja --version

      - name: Target OS
        run: echo -e "\ntarget_os = [\"android\"]" >> .gclient
        shell: bash
        working-directory: build

      - name: Free Disk Space (Ubuntu)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/ghc /usr/local/.ghcup
          sudo docker system prune --all --force || true
          sudo apt-get clean
          df -h

      - name: Build WebRTC
        run: chmod +x ./libwebrtc_android_build.sh && ./libwebrtc_android_build.sh --profile ${{ matrix.profile }} --commit "${{ github.event.inputs.commitHash }}"
        working-directory: build

      - name: Rename AAR
        run: mv build/android-${{ matrix.profile }}/libwebrtc.aar build/android-${{ matrix.profile }}/libwebrtc-android-${{ matrix.profile }}.aar

      - name: Generate shasum
        run: |
          cd build/android-${{ matrix.profile }}
          shasum -a 256 libwebrtc-android-${{ matrix.profile }}.aar > libwebrtc-android-${{ matrix.profile }}.aar.shasum

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: libwebrtc-android-${{ matrix.profile }}
          path: build/android-${{ matrix.profile }}/libwebrtc-android-${{ matrix.profile }}.aar*

  create-release:
    name: Release to GH (Draft)
    if: startsWith(github.ref, 'refs/tags')
    needs:
      - build-apple
      - build-win
      - build-linux
      - build-android
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ github.workspace }}/artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -lR ${{ github.workspace }}/artifacts

      - name: Upload artifacts to the release
        run: |
          rm -f "${{ github.workspace }}"/artifacts/apple-*.tar
          gh release upload ${{ github.ref_name }} ${{ github.workspace }}/artifacts/*
